apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gsma-open-gateway.fullname" . }}
  labels:
    {{- include "gsma-open-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gsma-open-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gsma-open-gateway.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      hostAliases:                # TO BE REMOVED LATER
      - ip: "10.255.28.183"       # TO BE REMOVED LATER
        hostnames:                # TO BE REMOVED LATER
        - "capifcore"             # TO BE REMOVED LATER
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gsma-open-gateway.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.capif.enabled }}
      initContainers:
      # Populates/prepares the shared hostPath directory (permissions) before
      # the gateway writes its CAPIF onboarding certs into it at startup.
      - name: prepare-capif-certs-dir
        image: busybox
        command: [ 'sh', '-c', 'mkdir -p /capif-certs && chmod -R 0777 /capif-certs' ]
        volumeMounts:
        - name: capif-certs
          mountPath: /capif-certs
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: GATEWAY_REDIS__URL
              value: "redis://{{ printf "%s-headless" (include "common.names.fullname" .Subcharts.redis) }}"

            {{- if .Values.redis.auth.enabled }}
            - name: GATEWAY_REDIS__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "redis.secretName" .Subcharts.redis }}
                  key: {{ template "redis.secretPasswordKey" .Subcharts.redis }}
            {{- end }}

            {{- if .Values.capif.enabled }}
            # CAPIF
            - name: GATEWAY_GSMA_APIS_PROTECTED_BY_CAPIF
              value: {{ .Values.capif.enabled | quote }}
            - name: GATEWAY_CAPIF_SDK__CLEANUP_ON_SHUTDOWN
              value: {{ .Values.capif.cleanupOnShutdown | quote }}
            - name: GATEWAY_CAPIF_SDK__CAPIF_HOST
              value: {{ .Values.capif.host | quote }}
            - name: GATEWAY_CAPIF_SDK__REGISTER_HOST
              value: {{ .Values.capif.registerHost | quote }}
            - name: GATEWAY_CAPIF_SDK__CAPIF_HTTPS_PORT
              value: {{ .Values.capif.httpsPort | quote }}
            - name: GATEWAY_CAPIF_SDK__CAPIF_REGISTER_PORT
              value: {{ .Values.capif.registerPort | quote }}
            - name: GATEWAY_CAPIF_SDK__CAPIF_USERNAME
              value: {{ .Values.capif.username | quote }}
            - name: GATEWAY_CAPIF_SDK__CAPIF_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gsma-open-gateway.fullname" . }}-capif
                  key: CAPIF_PASSWORD
            {{- end }}

            {{- if .Values.gatewayConfig }}
            {{- if .Values.gatewayConfig.nef }}
            {{- if not (hasKey .Values.gatewayConfig.nef "gateway_notification_url") }}
            - name: GATEWAY_NEF__GATEWAY_NOTIFICATION_URL
              value: "http://{{ include "gsma-open-gateway.fullname" . }}.{{ .Release.Namespace }}.svc"
            {{- end }}
            {{- end }}
            {{- end }}

            {{- if .Values.nefSecret.name }}
            - name: GATEWAY_NEF__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nefSecret.name }}
                  key: {{ .Values.nefSecret.passwordKey }}

            {{- if .Values.nefSecret.usernameKey }}
            - name: GATEWAY_NEF__USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nefSecret.name }}
                  key: {{ .Values.nefSecret.usernameKey }}
            {{- end }}

            {{- end }}
              
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}

          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              subPath: "config.toml"
              mountPath: "/app/config.toml"
              readOnly: true
            {{- if .Values.capif.enabled }}
            - name: capif-certs
              mountPath: /app/app/capif/certificates
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "gsma-open-gateway.fullname" . }}-config
        {{- if .Values.capif.enabled }}
        - name: capif-certs
          hostPath:
            path: {{ .Values.capif.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- toYaml .Values.extraVolumes | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
