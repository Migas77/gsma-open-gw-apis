replicaCount: 1

image:
  repository: ghcr.io/migas77/gateway
  # run-docker-build.sh only ever pushes `latest` (no per-version tag), so default
  # to that instead of falling back to .Chart.AppVersion, which is never pushed.
  # Always (not IfNotPresent) because `latest` is mutable - the node would
  # otherwise keep reusing whatever it already cached under that tag.
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  rules: []
  tls: []

livenessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

extraVolumes: []
extraVolumeMounts: []

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# NEF basic-auth credentials: created by the chart, or read from an existing
# Secret in this namespace when create is false.
nefSecret:
  create: false
  username: ""
  password: ""
  name: ""
  usernameKey: username
  passwordKey: password

gatewayConfig:
  # Must be an externally-reachable address for the gateway (used to build the
  # CAPIF publish URL and NEF notification/callback URLs). It also can't be a
  # bare hostname like "localhost" - CAPIF core validates aefProfiles.*.fqdn
  # against a dotted-domain regex, so a plain IP (parsed as ipv4Addr instead
  # of fqdn) is used here instead, same as NEF_emulator's NGINX_HOST.
  # The port MUST be explicit and MUST be nginx.service.ports[1].port (the mTLS
  # TLS listener CAPIF invokers reach the AEF on) - same as NEF_emulator, which
  # publishes https://{NGINX_HOST}:{NGINX_HTTPS}. The SDK's api_schema_translator
  # captures the scheme as "https://" and compares it against "https", so a URL
  # without a port always falls back to port 80 and every invoker then does a TLS
  # handshake against the plain-HTTP listener ([SSL: WRONG_VERSION_NUMBER]).
  gateway_public_url: "https://10.255.28.207:8443"  # TO BE REMOVED LATER

# CAPIF integration.
# The gateway generates its onboarding certificates at runtime under
# app/capif/certificates/<capif.username>/. Since there's no shared
# filesystem across nodes by default, certs are shared via a hostPath
# volume - which means the pod MUST land on the same node across restarts.
# Set .Values.nodeSelector to pin it there (e.g. a single-node/dev cluster).
capif:
  enabled: true
  # Offboard + unpublish from CAPIF core on pod shutdown (SIGTERM), e.g. on
  # helm uninstall/rollout - so CAPIF core doesn't accumulate stale
  # registrations across reinstalls (see the "Already registered service
  # with same api name" 403 this caused before).
  cleanupOnShutdown: true
  hostPath: /mnt/gateway-capif-certs
  # capif.host MUST stay the hostname CAPIF's nginx serves its cert for
  # (CAPIF_HOSTNAME in capif/helm/scripts/variables.sh): the SDK verifies every
  # call after onboarding against the downloaded ca.crt, which checks this
  # hostname against the cert SAN - a *.svc.cluster.local name fails there.
  # Nothing resolves that name (it's only in the Ingress rule and the cert), so
  # it is mapped to an address via the pod's hostAliases - see ingressIP.
  host: capif.testbed.develop
  # registerHost needs no alias: the SDK reaches register on its ClusterIP
  # service port (8084, not via the ingress) and calls getauth with
  # verify=False, so plain cluster DNS is enough here.
  registerHost: register.ocf-capif.svc.cluster.local
  # Address capif.host resolves to, injected as a hostAlias on the gateway pod
  # (this is what capif/helm/scripts/05_install_capif_register.sh does for
  # CAPIF's own register pod). Use the ingress-nginx controller ClusterIP -
  # it lives outside the ocf-capif namespace and so survives CAPIF reinstalls:
  #   kubectl get svc -A | awk '/ingress-nginx-controller/ {print $4; exit}'
  # Left empty the hostAliases block is omitted entirely and onboarding fails
  # with "Name or service not known".
  ingressIP: "10.43.81.164"
  httpsPort: "443"
  registerPort: "8084"
  username: gsma_provider_invoker
  # password should be overridden with --set capif.password=... or a values override file, not committed here
  password: password

# Nginx reverse proxy (TLS termination + mTLS client-cert check required by CAPIF)
nginx:
  enabled: true
  name: nginx
  deployment:
    image: ghcr.io/migas77/nginx-gateway:latest
    ports:
      - containerPort: 80
      - containerPort: 443
  service:
    type: LoadBalancer
    ports:
      - name: http
        port: 8081
        targetPort: 80
        protocol: TCP
      - name: https
        port: 8443
        targetPort: 443
        protocol: TCP

redis:
  auth:
    enabled: false
  architecture: standalone
  master:
    persistence:
      size: 1Gi
